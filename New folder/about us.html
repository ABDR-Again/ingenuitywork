<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us - Ingenuityworks</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    /* =========================================
       Base Variables & Reset
       ========================================= */
    :root {
      --bg-color: #F7F7F5;
      --text-main: #111111;
      --text-muted: #6B7280;
      --orange-primary: #F05A28;
      --orange-hover: #D94D20;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* Spacer for preview */
    .spacer { height: 20vh; }

    /* =========================================
       About Us Section
       ========================================= */
    .about-section {
      padding: 6rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
      overflow: hidden;
    }

    .section-header {
      text-align: center;
      margin-bottom: 4rem;
    }

    .section-header h2 {
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: -1px;
    }

    .section-header p {
      font-size: clamp(1.1rem, 2vw, 1.25rem);
      color: var(--text-muted);
    }

    /* =========================================
       Bento Grid Layout (Desktop & Tablet)
       ========================================= */
    .bento-container {
      position: relative;
    }

    .bento-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 280px);
      gap: 20px;
      margin-bottom: 3rem;
    }

    .bento-item {
      position: relative;
      overflow: hidden;
      background-color: #E2E8F0; /* Visible placeholder color */
      /* GSAP Initial State */
      opacity: 0;
      transform: scale(0.95);
    }

    /* Grid Positioning */
    .item-tall   { grid-column: span 1; grid-row: span 2; }
    .item-wide   { grid-column: span 2; grid-row: span 1; }
    .item-square { grid-column: span 1; grid-row: span 1; }

    /* Image Styling - Enforcing strict straight lines */
    .bento-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 0 !important; 
      border: none;
    }

    /* Mobile Controls (Hidden on Desktop) */
    .mobile-controls {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin-top: 1.5rem;
      margin-bottom: 3rem;
    }

    .slider-arrow {
      background: var(--bg-color);
      border: 2px solid var(--text-main);
      width: 48px;
      height: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .slider-arrow:hover {
      background: var(--text-main);
      color: var(--bg-color);
    }
    
    .slider-arrow:active {
      transform: scale(0.95);
    }

    .slider-arrow svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
    }

    /* =========================================
       Action Button
       ========================================= */
    .action-container {
      text-align: center;
      margin-top: 3rem;
    }

    .btn-meet {
      background-color: var(--orange-primary);
      color: #FFFFFF;
      border: none;
      padding: 1rem 2.5rem;
      font-family: inherit;
      font-size: 1.125rem;
      font-weight: 700;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.3s ease;
      /* GSAP Initial State */
      opacity: 0;
      transform: translateY(20px);
    }

    .btn-meet:hover {
      background-color: var(--orange-hover);
      transform: translateY(-3px) !important; /* Overrides GSAP resting state */
      box-shadow: 0 10px 20px rgba(240, 90, 40, 0.2);
    }

    /* =========================================
       Responsive Adjustments
       ========================================= */
    
    /* Tablet */
    @media (max-width: 1024px) {
      .bento-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: auto;
        grid-auto-rows: 250px;
      }
      .item-tall { grid-column: span 2; grid-row: span 1; }
      .item-wide { grid-column: span 2; grid-row: span 1; }
      .item-square { grid-column: span 1; grid-row: span 1; }
    }

    /* Mobile (Horizontal Slider) */
    @media (max-width: 768px) {
      .about-section {
        padding: 4rem 1rem;
      }

      .bento-grid {
        display: flex;
        overflow-x: hidden; /* JS will handle the scroll to hide scrollbar cleanly */
        scroll-behavior: smooth;
        gap: 15px;
        margin-bottom: 0;
        /* Allow items to snap and show slightly off-screen */
        width: 100%;
      }

      .bento-item {
        flex: 0 0 100%;
        height: 350px;
      }

      /* Reset grid span classes for flex context */
      .item-tall, .item-wide, .item-square {
        grid-column: auto;
        grid-row: auto;
      }

      /* Show mobile controls */
      .mobile-controls {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <div class="spacer"></div>

  <section class="about-section">
    <div class="section-header">
      <h2 class="gsap-heading">About Us</h2>
      <p class="gsap-subheading">The people behind the strategy, creativity, and growth.</p>
    </div>

    <div class="bento-container">
      <div class="bento-grid" id="slider-track">
        
        <div class="bento-item item-tall gsap-img">
          <img src="" alt="Office Workspace and Team Member" />
        </div>
        
        <div class="bento-item item-wide gsap-img">
          <img src="" alt="Team Collaboration Meeting" />
        </div>
        
        <div class="bento-item item-square gsap-img">
          <img src="" alt="Office Interior Setup" />
        </div>
        
        <div class="bento-item item-square gsap-img">
          <img src="" alt="Creative Workspace Details" />
        </div>
        
        <div class="bento-item item-square gsap-img">
          <img src="" alt="Team Member Working on Laptop" />
        </div>
        
        <div class="bento-item item-square gsap-img"> <img src="" alt="Group Brainstorming Session" />
        </div>

      </div>

      <div class="mobile-controls">
        <button class="slider-arrow" id="prevBtn" aria-label="Previous Image">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button class="slider-arrow" id="nextBtn" aria-label="Next Image">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <div class="action-container">
      <button class="btn-meet gsap-btn">Meet Our Team</button>
    </div>
  </section>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      // ==========================================
      // 1. GSAP Scroll Animations
      // ==========================================
      gsap.registerPlugin(ScrollTrigger);

      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: ".about-section",
          start: "top 75%", // Triggers when section is 75% visible
          toggleActions: "play none none none"
        }
      });

      // Heading appears
      tl.fromTo(".gsap-heading", 
        { y: 30, opacity: 0 }, 
        { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }
      )
      // Subheading appears
      .fromTo(".gsap-subheading", 
        { y: 30, opacity: 0 }, 
        { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 
        "-=0.4"
      )
      // Images appear in completely RANDOM order
      .to(".gsap-img", {
        scale: 1,
        opacity: 1,
        duration: 0.6,
        stagger: {
          amount: 0.8,
          from: "random" // Core requirement: Random appearance
        },
        ease: "back.out(1.2)"
      }, "-=0.2")
      // Button appears last
      .to(".gsap-btn", {
        y: 0,
        opacity: 1,
        duration: 0.5,
        ease: "power2.out"
      }, "-=0.2");


      // ==========================================
      // 2. Mobile Slider Logic
      // ==========================================
      const sliderTrack = document.getElementById('slider-track');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const items = document.querySelectorAll('.bento-item');
      
      let currentIndex = 0;

      // Function to scroll to specific index
      const goToSlide = (index) => {
        if (!items[index]) return;
        const itemLeft = items[index].offsetLeft;
        
        sliderTrack.scrollTo({
          left: itemLeft,
          behavior: 'smooth'
        });
      };

      nextBtn.addEventListener('click', () => {
        if (currentIndex < items.length - 1) {
          currentIndex++;
        } else {
          // Loop back to start if at the end
          currentIndex = 0;
        }
        goToSlide(currentIndex);
      });

      prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
          currentIndex--;
        } else {
          // Loop to end if at the beginning
          currentIndex = items.length - 1;
        }
        goToSlide(currentIndex);
      });

      // Update currentIndex on manual swipe/scroll
      sliderTrack.addEventListener('scroll', () => {
        const scrollPosition = sliderTrack.scrollLeft;
        const itemWidth = items[0].offsetWidth;
        currentIndex = Math.round(scrollPosition / itemWidth);
      });

    });
  </script>

</body>
</html>
