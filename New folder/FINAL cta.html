<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let's Grow Your Business CTA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    /* =========================================
       Base Variables & Reset
       ========================================= */
    :root {
      --bg-canvas: #F7F7F5;
      --text-ink: #111111;
      --text-muted: #6B7280;
      --orange-primary: #FF5A00;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-ink);
      -webkit-font-smoothing: antialiased;
      /* Centering for standalone view */
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }

    /* =========================================
       CTA Section Layout
       ========================================= */
    .cta-section {
      text-align: center;
      padding: 6rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      overflow: hidden;
    }

    /* Heading Styling */
    .cta-heading {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      color: var(--text-ink);
    }

    .cta-heading span {
      color: var(--orange-primary);
    }

    /* Subheading Styling */
    .cta-subheading {
      font-size: clamp(1.125rem, 2.5vw, 1.5rem);
      color: var(--text-muted);
      font-weight: 400;
      margin-bottom: 3.5rem;
    }

    /* =========================================
       Button Styling & Animation
       ========================================= */
    .btn-lets-talk {
      display: inline-block;
      width: 100%;
      max-width: 900px;
      padding: clamp(2rem, 5vw, 4rem) 2rem;
      background-color: transparent;
      border: 3px solid var(--orange-primary);
      border-radius: 24px;
      
      /* Text Styling */
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 700;
      color: var(--orange-primary);
      letter-spacing: -2px;
      
      cursor: pointer;
      will-change: transform, background-color, color;
      
      /* Base Transition for color changes */
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Vibration Keyframes */
    @keyframes vibrate {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
    }

    /* Hover State: Orange background, White text, Vibration */
    .btn-lets-talk:hover {
      background-color: var(--orange-primary);
      color: #FFFFFF;
      /* 0.15s duration looped infinitely creates a rapid buzz/vibration */
      animation: vibrate 0.15s linear infinite;
    }

    /* Optional: active state micro-interaction */
    .btn-lets-talk:active {
      animation: none; /* Stop vibration on click */
      transform: scale(0.98);
    }

    /* =========================================
       Mobile Optimization
       ========================================= */
    @media (max-width: 768px) {
      .cta-section {
        padding: 4rem 1.5rem;
      }
      .btn-lets-talk {
        border-width: 2px;
        border-radius: 16px;
        letter-spacing: -1px;
      }
    }
  </style>
</head>
<body>

  <section class="cta-section">
    <h2 class="cta-heading gsap-heading">Let’s Grow Your Business—<span>Together.</span></h2>
    <p class="cta-subheading gsap-sub">Smart strategies. Real results. Let’s make it happen.</p>
    
    <button class="btn-lets-talk gsap-btn">Let's Talk</button>
  </section>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Register GSAP ScrollTrigger
      gsap.registerPlugin(ScrollTrigger);

      // Create the entrance timeline
      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: ".cta-section",
          start: "top 85%", // Triggers when the section is 85% down the viewport
          toggleActions: "play none none none"
        }
      });

      // 1. Heading appears
      tl.fromTo(".gsap-heading", 
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }
      )
      // 2. Subheading appears
      .fromTo(".gsap-sub",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        "-=0.5" // Overlap with previous animation
      )
      // 3. Let's Talk button appears
      .fromTo(".gsap-btn",
        { y: 40, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.2)" },
        "-=0.4"
      );
    });
  </script>

</body>
</html>
