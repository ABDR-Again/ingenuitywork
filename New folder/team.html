<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Our Team</title>
  <style>
    /* Base Reset & Typography */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      color: #333;
    }

    /* Section & Headers */
    .team-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 2rem;
      text-align: center;
    }

    .team-heading {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: #1a1a1a;
    }

    .highlight {
      color: #f97316; /* Orange matching the image */
    }

    .team-subheading {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 3rem;
      max-width: 600px;
      margin-inline: auto;
      line-height: 1.6;
    }

    /* Carousel Layout */
    .carousel-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .carousel-track {
      display: flex;
      gap: 24px;
      overflow-x: auto;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding: 1rem 0; /* Padding to prevent box-shadow clipping on hover */
      
      /* Hide scrollbars */
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }

    .carousel-track::-webkit-scrollbar {
      display: none; /* Chrome, Safari and Opera */
    }

    /* Cards & Hover Effects */
    .card {
      /* 4 items on desktop: 25% width minus the gap */
      flex: 0 0 calc(25% - 18px); 
      scroll-snap-align: start;
      border-radius: 16px;
      overflow: hidden;
      background-color: #f5f5f5;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
    }

    /* The hover effect */
    .card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
    }

    /* Navigation Buttons */
    .nav-btn {
      background: white;
      border: 1px solid #eee;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.2rem;
      color: #f97316;
      cursor: pointer;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .nav-btn:hover {
      background: #f97316;
      color: white;
    }

    .prev-btn { left: -24px; }
    .next-btn { right: -24px; }

    /* Responsive Design */
    @media (max-width: 992px) {
      .card { flex: 0 0 calc(33.333% - 16px); } /* 3 items for small desktop */
    }

    @media (max-width: 768px) {
      .card { flex: 0 0 calc(50% - 12px); } /* 2 items for tablets */
      .prev-btn { left: -10px; }
      .next-btn { right: -10px; }
    }

    @media (max-width: 480px) {
      .card { flex: 0 0 100%; } /* 1 item for mobile */
      .team-heading { font-size: 2.2rem; }
      .nav-btn { display: none; } /* Better to rely purely on swipe for mobile */
    }
  </style>
</head>
<body>

  <section class="team-section">
    <div class="header-content">
      <h2 class="team-heading">Meet Our <span class="highlight">Team</span></h2>
      <p class="team-subheading">A passionate team of strategists, creatives, and analysts driving growth and delivering results.</p>
    </div>

    <div class="carousel-container">
      <button class="nav-btn prev-btn" aria-label="Previous">&lt;</button>
      
      <div class="carousel-track">
        <div class="card"><img src="https://placehold.co/300x400/f5f5f5/333?text=Member+1" alt="Team Member 1"></div>
        <div class="card"><img src="https://placehold.co/300x400/f5f5f5/333?text=Member+2" alt="Team Member 2"></div>
        <div class="card"><img src="https://placehold.co/300x400/f5f5f5/333?text=Member+3" alt="Team Member 3"></div>
        <div class="card"><img src="https://placehold.co/300x400/f5f5f5/333?text=Member+4" alt="Team Member 4"></div>
        <div class="card"><img src="https://placehold.co/300x400/f5f5f5/333?text=Member+5" alt="Team Member 5"></div>
        <div class="card"><img src="https://placehold.co/300x400/f5f5f5/333?text=Member+6" alt="Team Member 6"></div>
        <div class="card"><img src="https://placehold.co/300x400/f5f5f5/333?text=Member+7" alt="Team Member 7"></div>
        <div class="card"><img src="https://placehold.co/300x400/f5f5f5/333?text=Member+8" alt="Team Member 8"></div>
      </div>

      <button class="nav-btn next-btn" aria-label="Next">&gt;</button>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <script>
    // --- Carousel Functionality ---
    const track = document.querySelector('.carousel-track');
    const prevBtn = document.querySelector('.prev-btn');
    const nextBtn = document.querySelector('.next-btn');

    // Calculate how much to scroll based on one card's width + gap
    const getScrollAmount = () => {
      const card = document.querySelector('.card');
      const gap = 24; // matches the gap in CSS
      return card.offsetWidth + gap;
    };

    nextBtn.addEventListener('click', () => {
      track.scrollBy({ left: getScrollAmount(), behavior: 'smooth' });
    });

    prevBtn.addEventListener('click', () => {
      track.scrollBy({ left: -getScrollAmount(), behavior: 'smooth' });
    });


    // --- GSAP Entrance Animations ---
    // Create a timeline to sequence the animations
    const tl = gsap.timeline();

    // 1. Header appears from top
    tl.from(".team-heading", {
      opacity: 0,
      y: -30,
      duration: 0.8,
      ease: "power3.out"
    })
    // 2. Subheading follows
    .from(".team-subheading", {
      opacity: 0,
      y: -20,
      duration: 0.8,
      ease: "power3.out"
    }, "-=0.4") // Starts slightly before the header finishes
    // 3. Team images appear with a stagger and slight bounce
    .from(".card", {
      opacity: 0,
      y: 50,
      duration: 0.8,
      stagger: 0.15, // Animates each card 0.15s after the previous one
      ease: "back.out(1.5)" 
    }, "-=0.2");
  </script>
</body>
</html>
