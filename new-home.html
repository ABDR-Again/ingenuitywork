<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingenuityworks — Digital Marketing Agency</title>
  <meta name="description" content="Ingenuityworks is a results-focused digital marketing agency offering SEO, Google Ads, web development, and more.">


  <style>
    @font-face {
      font-family: 'DM Sans';
      src: url('/fonts/DMSans-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'DM Sans';
      src: url('/fonts/DMSans-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'DM Sans';
      src: url('/fonts/DMSans-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* ===== Global Resets (applied once) ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #F7F7F5;
      color: #111827;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
  </style>
</head>
<body>

  {{> header }}

  {{> hero }}

  {{> problems-growth }}

  {{> about-us }}

  {{> services }}

  {{> tools }}

  {{> tracking }}

  {{> why-choose-us }}

  {{> industries }}

  {{> our-process }}

  {{> portfolio }}

  {{> testimonials }}

  {{> team }}

  {{> faqs }}

  {{> final-cta }}

  {{> footer }}

  <!-- Animations -->
  <script type="module" src="/src/new-home-animations.js"></script>
</body>
</html>
